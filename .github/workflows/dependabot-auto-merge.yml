name: Dependabot auto-merge
on:
  workflow_call:

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    steps:
      - name: Check freeze window
        id: freeze-check
        run: |
          # Freeze auto-merge during two windows (Europe/Oslo time):
          #   - Year-end: Dec 20 (1220) through Jan 02 (102)
          #   - Summer:   Jul 10 (710) through Aug 10 (810)
          # MONTH_DAY is today's date derived from MMDD (e.g., 0710 -> 710) as a base-10 integer.
          # When inside a window, frozen=true and later steps skip the merge.
          MONTH_DAY=$((10#$(TZ="Europe/Oslo" date +%m%d)))
          if (( MONTH_DAY >= 1220 || MONTH_DAY <= 102 || ( MONTH_DAY >= 710 && MONTH_DAY <= 810 ) )); then
            echo "frozen=true" >> "$GITHUB_OUTPUT"
          else
            echo "frozen=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Dependabot metadata
        if: steps.freeze-check.outputs.frozen == 'false'
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Auto-merge changes from Dependabot
        id: auto-merge
        if: steps.freeze-check.outputs.frozen == 'false' && (steps.metadata.outputs.update-type != 'version-update:semver-major' || steps.metadata.outputs.package-ecosystem == 'github_actions')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
