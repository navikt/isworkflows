name: Kotlin build and deploy
on:
  workflow_call:
    inputs:
      dev-cluster:
        required: false
        default: dev-gcp
        type: string
      prod-cluster:
        required: false
        default: prod-gcp
        type: string
      distroless:
        required: false
        default: true
        type: boolean

jobs:
  build-and-publish:
    uses: ./.github/workflows/kotlin-build-image.yml
    with:
      publish-image: ${{ !startsWith(github.ref_name, 'dependabot') }}
    secrets: inherit
    permissions:
      contents: "read"
      id-token: "write"

  nais-deploy:
    needs: build-and-publish
    uses: navikt/isworkflows/.github/workflows/deploy-dev-og-prod.yml@master
    with:
      image: ${{ needs.build-and-publish.outputs.image }}
      dev-cluster: ${{ inputs.dev-cluster }}
      prod-cluster: ${{ inputs.prod-cluster }}
    secrets: inherit
